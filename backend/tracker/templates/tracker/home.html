<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Care Home Tracking Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1f2937;
            margin: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-decoration: none;
            color: #1f2937;
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        .card:hover {
            background: #eef2ff;
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .card p {
            color: #6b7280;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Care Tracker</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link active" href="/location-logs/">Location Logs</a>
            <a class="nav-link" href="/users/">Service Users</a>
            <a class="nav-link" href="/tasks/">Tasks</a>
            <a class="nav-link" href="/admin/">Admin</a>
        </div>
    </div>
</nav>

    <h1>Care Home Tracking Dashboard</h1>

    <div class="grid">

        <a class="card" href="{% url 'tracker:service_user_list' %}">
            <h2>Service Users</h2>
            <p>View residents and their wristband status.</p>
        </a>

        <a class="card" href="{% url 'tracker:location_logs_dashboard' %}">
            <h2>Location Logs</h2>
            <p>View live BLE location activity and RSSI readings.</p>
        </a>

        <a class="card" href="{% url 'tracker:task_dashboard' %}">
            <h2>Tasks</h2>
            <p>View and manage care tasks.</p>
        </a>

        <a class="card" href="/admin/">
            <h2>Admin</h2>
            <p>Manage database records.</p>
        </a>

    </div>

</body>
</html>
