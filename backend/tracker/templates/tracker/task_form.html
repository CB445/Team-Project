<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-3">Create New Task</h1>
                        <form method="post" novalidate>
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label" for="id_title">Title</label>
                                {{ form.title }}
                                {{ form.title.errors }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="id_description">Description</label>
                                {{ form.description }}
                                {{ form.description.errors }}
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="id_assigned_to">Assigned To</label>
                                {{ form.assigned_to }}
                                {{ form.assigned_to.errors }}
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="id_due_date">Due Date & Time</label>
                                {{ form.due_date }}
                                {{ form.due_date.errors }}
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Save Task</button>
                                <a href="{% url 'tracker:task_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
