<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            color: #1f2937;
            background-color: #f8fafc;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        th,
        td {
            border: 1px solid #d1d5db;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #e5e7eb;
        }

        .empty-row {
            text-align: center;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <h1>Service Users</h1>

    <table>
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Age</th>
                <th>Room Number</th>
                <th>Risk Level</th>
            </tr>
        </thead>
        <tbody>
            {% for user in service_users %}
            <tr>
                <td>{{ user.first_name }} {{ user.last_name }}</td>
                <td>{{ user.age|default:"-" }}</td>
                <td>{{ user.room_number }}</td>
                <td>{{ user.get_risk_level_display }}</td>
            </tr>
            {% empty %}
            <tr>
                <td class="empty-row" colspan="4">No service users available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
